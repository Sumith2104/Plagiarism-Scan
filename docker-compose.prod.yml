version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.unified
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/backend/data
      - qdrant_data:/app/backend/qdrant_storage
    environment:
      - PYTHONUNBUFFERED=1

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  app_data:
  qdrant_data:
  caddy_data:
  caddy_config:
